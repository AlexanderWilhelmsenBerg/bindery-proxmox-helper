name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run helper smoke tests
        run: bash tests/smoke.sh
